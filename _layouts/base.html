<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} · {{ site.author.name }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.desc | default: site.description | strip_html | truncate: 160 }}"/>
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml"/>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}"/>
  {% feed_meta %}
</head>
<body>

  {% include nav.html %}

  {{ content }}

  {% include footer.html %}

</body>
</html>
